<aside class="bg-white dark:bg-dark-surface rounded-3xl shadow-card border border-gray-100 dark:border-dark-border flex flex-col max-h-[calc(100vh-8rem)]">
  <header class="flex items-center justify-between px-5 py-4 border-b border-gray-100 dark:border-dark-border">
    <div class="flex items-center gap-2.5">
      <span class="w-9 h-9 rounded-xl bg-brand-50 dark:bg-brand-900/30 text-brand-600 flex items-center justify-center"><i class="fa-solid fa-receipt"></i></span>
      <div>
        <h3 class="font-bold text-gray-900 dark:text-white leading-tight">Tu pedido</h3>
        <p class="text-[11px] text-gray-400 dark:text-dark-muted">{{ carrito.totales().cantidadTotal }} productos</p>
      </div>
    </div>
    @if (!carrito.estaVacio()) {
      <button type="button" (click)="vaciar()" class="text-[11px] font-bold text-gray-400 hover:text-brand-600 transition">Vaciar</button>
    }
  </header>

  @if (carrito.estaVacio()) {
    <div class="px-5 py-12 text-center">
      <div class="w-14 h-14 rounded-2xl bg-gray-100 dark:bg-dark-card text-gray-400 flex items-center justify-center mx-auto mb-3"><i class="fa-solid fa-basket-shopping text-xl"></i></div>
      <p class="font-bold text-sm text-gray-700 dark:text-dark-text">Todavía no agregaste nada</p>
      <p class="text-xs text-gray-400 dark:text-dark-muted mt-1">Tocá un producto para sumarlo a tu pedido.</p>
    </div>
  } @else {
    <div class="flex-1 overflow-y-auto custom-scroll px-5">
      <app-lista-items-carrito />
    </div>
    <footer class="px-5 py-4 border-t border-gray-100 dark:border-dark-border space-y-4">
      <app-resumen-totales />
      <button type="button" (click)="confirmar()" class="w-full h-12 rounded-2xl bg-brand-600 hover:bg-brand-700 text-white font-bold text-sm shadow-coral tap-scale transition flex items-center justify-center gap-2">
        <i class="fa-brands fa-whatsapp text-base"></i>
        Confirmar pedido
      </button>
    </footer>
  }
</aside>
