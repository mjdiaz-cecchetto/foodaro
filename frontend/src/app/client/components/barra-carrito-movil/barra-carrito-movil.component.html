@if (!carrito.estaVacio() && !carrito.hojaAbierta()) {
  <div class="lg:hidden fixed bottom-4 inset-x-4 z-40">
    <button type="button" (click)="abrir()" class="w-full h-14 rounded-2xl bg-brand-600 hover:bg-brand-700 text-white shadow-coral-lg flex items-center justify-between px-4 tap-scale transition">
      <span class="flex items-center gap-3">
        <span class="w-8 h-8 rounded-xl bg-white/20 flex items-center justify-center font-black text-sm">{{ carrito.totales().cantidadTotal }}</span>
        <span class="font-bold text-sm">Ver pedido</span>
      </span>
      <span class="font-black">{{ carrito.totales().total | precio }}</span>
    </button>
  </div>
}
