@let p = perfil();
<aside
  class="fixed md:static inset-y-0 left-0 z-50 w-64 h-full bg-white dark:bg-surface-dark border-r border-zinc-200 dark:border-surface-borderDark flex flex-col transform md:translate-x-0 transition-transform duration-300 ease-in-out shrink-0"
  [class.-translate-x-full]="!abierta()"
>
  <!-- Marca -->
  <div class="h-16 shrink-0 px-5 border-b border-zinc-100 dark:border-surface-borderDark flex items-center gap-2.5">
    <app-logo variante="isotipo" tamanio="sm" [href]="'/'" />
    <div class="min-w-0">
      <p class="text-[10px] font-bold text-zinc-400 uppercase tracking-wider leading-none">Panel de</p>
      <h4 class="text-sm font-extrabold text-zinc-900 dark:text-white truncate mt-0.5">Administración</h4>
    </div>
  </div>

  <div class="flex-1 min-h-0 overflow-y-auto custom-scroll">
    <!-- Tarjeta del local -->
    <div class="px-5 py-4 border-b border-zinc-100 dark:border-surface-borderDark">
      <a [href]="enlacePortada()" target="_blank" class="flex items-center gap-3 p-2 rounded-2xl bg-zinc-50 dark:bg-surface-cardDark/70 border border-zinc-100 dark:border-surface-borderDark hover:border-brand-300 transition">
        <img [src]="p.logoUrl" alt="Logo" class="w-10 h-10 rounded-xl object-cover ring-2 ring-brand-500/20" />
        <div class="min-w-0 flex-1">
          <h4 class="text-xs font-bold text-zinc-900 dark:text-white truncate">{{ p.nombre }}</h4>
          <div class="flex items-center gap-1.5 mt-0.5">
            <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
            <span class="text-[10px] font-medium text-emerald-600 dark:text-emerald-400">Carta activa</span>
          </div>
        </div>
      </a>
    </div>

    <!-- Navegación -->
    <nav class="p-4 space-y-1.5">
      @for (item of items; track item.ruta) {
        <a
          [routerLink]="item.ruta"
          routerLinkActive
          #rla="routerLinkActive"
          (click)="navegado.emit()"
          class="w-full flex items-center justify-between px-3.5 py-3 rounded-2xl font-bold text-xs transition-all"
          [class]="rla.isActive ? claseActiva : claseInactiva"
        >
          <div class="flex items-center gap-3">
            <i class="fa-solid w-4 text-center" [class]="item.icono"></i>
            <span>{{ item.etiqueta }}</span>
          </div>
          @switch (item.indicador) {
            @case ('contador') {
              <span class="text-[10px] font-black px-2 py-0.5 rounded-full bg-zinc-200 dark:bg-zinc-800 text-zinc-700 dark:text-zinc-300">{{ contadorDe(item) }}</span>
            }
            @case ('punto') {
              <span class="w-2 h-2 rounded-full bg-brand-500"></span>
            }
            @default {
              <i class="fa-solid fa-chevron-right text-[10px] opacity-70"></i>
            }
          }
        </a>
      }
    </nav>
  </div>

  <!-- Acciones inferiores (fijas) -->
  <div class="shrink-0 p-5 border-t border-zinc-100 dark:border-surface-borderDark space-y-3">
    <a [href]="enlaceCarta()" target="_blank" class="w-full py-2.5 px-4 rounded-xl bg-zinc-900 hover:bg-black dark:bg-white dark:hover:bg-zinc-100 text-white dark:text-zinc-900 text-xs font-bold flex items-center justify-center gap-2 tap-scale shadow-sm transition">
      <i class="fa-solid fa-arrow-up-right-from-square"></i>
      <span>Abrir carta digital</span>
    </a>
    <p class="text-[10px] text-zinc-400 text-center font-medium">Hecho con <span class="font-brand text-sm align-middle">foodaro</span></p>
  </div>
</aside>
