<div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2.5 pb-2.5 border-b border-zinc-200 dark:border-surface-borderDark">
  <div>
    <h1 class="text-xl sm:text-2xl font-extrabold tracking-tight text-zinc-900 dark:text-white leading-tight">{{ titulo() }}</h1>
    @if (subtitulo()) {
      <p class="text-xs text-zinc-500 dark:text-zinc-400 mt-0.5">{{ subtitulo() }}</p>
    }
  </div>
  @if (etiquetaAccion()) {
    <button type="button" (click)="accion.emit()" class="bg-brand-600 hover:bg-brand-700 text-white font-bold py-2 px-4 rounded-xl text-xs shadow-coral tap-scale flex items-center justify-center gap-2 transition cursor-pointer shrink-0">
      <i class="fa-solid" [class]="iconoAccion()"></i>
      <span>{{ etiquetaAccion() }}</span>
    </button>
  }
</div>
