<div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 pb-2 border-b border-zinc-200 dark:border-surface-borderDark">
  <div>
    <h1 class="text-2xl sm:text-3xl font-extrabold tracking-tight text-zinc-900 dark:text-white">{{ titulo() }}</h1>
    @if (subtitulo()) {
      <p class="text-xs sm:text-sm text-zinc-500 dark:text-zinc-400 mt-1">{{ subtitulo() }}</p>
    }
  </div>
  @if (etiquetaAccion()) {
    <button type="button" (click)="accion.emit()" class="bg-brand-600 hover:bg-brand-700 text-white font-bold py-2.5 px-5 rounded-2xl text-xs sm:text-sm shadow-coral tap-scale flex items-center justify-center gap-2 transition">
      <i class="fa-solid" [class]="iconoAccion()"></i>
      <span>{{ etiquetaAccion() }}</span>
    </button>
  }
</div>
