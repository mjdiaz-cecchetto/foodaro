@let p = perfil();
<div class="bg-white dark:bg-surface-dark rounded-2xl p-3.5 shadow-soft border border-zinc-200/80 dark:border-surface-borderDark space-y-2">
  <div class="flex items-center justify-between">
    <span class="text-[11px] font-extrabold uppercase tracking-wider text-zinc-500 dark:text-zinc-400 flex items-center gap-1.5">
      <i class="fa-solid fa-eye text-brand-500"></i> Vista previa del banner
    </span>
    <span class="text-[11px] font-bold text-emerald-700 bg-emerald-50 dark:bg-emerald-500/15 dark:text-emerald-400 px-2.5 py-0.5 rounded-full">Se actualiza en tiempo real</span>
  </div>

  <div class="relative w-full h-32 sm:h-36 rounded-xl overflow-hidden bg-zinc-900 shadow-inner">
    <img [src]="p.portadaUrl" alt="Portada" class="w-full h-full object-cover opacity-90" />
    <div class="absolute inset-0 bg-gradient-to-t from-black/90 via-black/40 to-black/10"></div>
    <div class="absolute top-2.5 left-3.5">
      <span class="text-white backdrop-blur-sm text-[11px] font-bold px-2.5 py-0.5 rounded-full shadow-md flex items-center gap-1.5" [class]="p.abiertoAhora ? 'bg-emerald-500/90' : 'bg-zinc-700/80'">
        <span class="w-1.5 h-1.5 rounded-full bg-white" [class.animate-pulse]="p.abiertoAhora"></span>
        <span>{{ p.estado || 'Horario sin cargar' }}</span>
      </span>
    </div>
    <div class="absolute bottom-2.5 left-3.5 sm:left-4 right-4 flex items-end gap-3 z-10">
      <img [src]="p.logoUrl" alt="Logo" class="w-12 h-12 sm:w-14 sm:h-14 rounded-xl ring-2 ring-white/90 shadow-xl object-cover bg-white shrink-0" />
      <div class="pb-0.5 min-w-0">
        <span class="text-[10px] font-bold px-2 py-0.5 rounded-md bg-white/20 text-white border border-white/25 backdrop-blur-md">{{ p.rubro || 'Rubro' }}</span>
        <h3 class="text-base sm:text-lg font-black text-white leading-tight truncate mt-0.5">{{ p.nombre || 'Nombre del local' }}</h3>
        <p class="text-[11px] sm:text-xs text-gray-200 font-medium truncate">{{ p.eslogan || 'Eslogan del local' }}</p>
      </div>
    </div>
  </div>
</div>
