@let p = perfil();
<div class="bg-white dark:bg-surface-dark rounded-3xl p-6 shadow-soft border border-zinc-100 dark:border-surface-borderDark space-y-3">
  <div class="flex items-center justify-between">
    <span class="text-xs font-bold uppercase tracking-wider text-zinc-400 flex items-center gap-2">
      <i class="fa-solid fa-eye text-brand-500"></i> Vista previa del banner
    </span>
    <span class="text-[11px] font-semibold text-emerald-600 bg-emerald-50 dark:bg-emerald-500/10 dark:text-emerald-400 px-2.5 py-0.5 rounded-full">Se actualiza en tiempo real</span>
  </div>

  <div class="relative w-full h-44 sm:h-52 rounded-2xl overflow-hidden bg-zinc-900 shadow-inner">
    <img [src]="p.portadaUrl" alt="Portada" class="w-full h-full object-cover opacity-90" />
    <div class="absolute inset-0 bg-gradient-to-t from-black/90 via-black/40 to-black/10"></div>
    <div class="absolute top-3 left-4">
      <span class="text-white backdrop-blur-sm text-[11px] font-bold px-3 py-1 rounded-full shadow-md flex items-center gap-1.5" [class]="p.abiertoAhora ? 'bg-emerald-500/90' : 'bg-zinc-700/80'">
        <span class="w-1.5 h-1.5 rounded-full bg-white" [class.animate-pulse]="p.abiertoAhora"></span>
        <span>{{ p.estado || 'Horario sin cargar' }}</span>
      </span>
    </div>
    <div class="absolute bottom-3 left-4 sm:left-6 right-4 flex items-end gap-3.5 z-10">
      <img [src]="p.logoUrl" alt="Logo" class="w-16 h-16 sm:w-20 sm:h-20 rounded-2xl ring-2 ring-white/90 shadow-xl object-cover bg-white shrink-0" />
      <div class="pb-1 min-w-0">
        <span class="text-[10px] font-semibold px-2 py-0.5 rounded-lg bg-white/15 text-white border border-white/20 backdrop-blur-md">{{ p.rubro || 'Rubro' }}</span>
        <h3 class="text-lg sm:text-2xl font-black text-white leading-tight truncate mt-1">{{ p.nombre || 'Nombre del local' }}</h3>
        <p class="text-xs text-gray-200 font-medium truncate">{{ p.eslogan || 'Eslogan del local' }}</p>
      </div>
    </div>
  </div>
</div>
