<header class="sticky top-0 z-30 bg-white/95 dark:bg-dark-surface/95 backdrop-blur-md border-b border-gray-100 dark:border-dark-border">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-14 sm:h-16 flex items-center justify-between gap-3">

    <!-- Isotipo + nombre del local -->
    <div class="flex items-center gap-2.5 min-w-0">
      <app-logo variante="isotipo" tamanio="sm" [href]="enlacePortada()" />
      <span class="font-extrabold text-sm sm:text-base text-gray-900 dark:text-white truncate">{{ perfil().nombre }}</span>
    </div>

    <!-- Acciones -->
    <div class="flex items-center gap-2 sm:gap-3 shrink-0">
      <app-alternar-tema
        claseBoton="w-9 h-9 sm:w-10 sm:h-10 rounded-2xl bg-gray-100 dark:bg-dark-card border border-gray-200/80 dark:border-dark-border text-gray-700 dark:text-amber-400 flex items-center justify-center tap-scale shadow-sm hover:scale-105"
        claseIcono="text-sm sm:text-base"
        (alternado)="alAlternarTema($event)"
      />

      <button type="button" (click)="abrirQr()" class="w-9 h-9 sm:w-auto sm:h-auto flex items-center justify-center gap-2 sm:px-4 sm:py-2.5 rounded-2xl bg-white dark:bg-dark-card hover:bg-gray-50 dark:hover:bg-dark-surface text-gray-800 dark:text-white border border-gray-200/80 dark:border-dark-border shadow-soft text-xs sm:text-sm font-bold tap-scale" title="Compartir Carta por QR o Enlace">
        <i class="fa-solid fa-qrcode text-brand-600 text-sm"></i>
        <span class="hidden sm:inline">Compartir</span>
      </button>

      @if (!ui.pedidosHabilitados()) {
        <a [routerLink]="enlacePedido()" class="h-9 sm:h-auto flex items-center justify-center gap-2 px-3 sm:px-4 sm:py-2.5 rounded-2xl bg-brand-600 hover:bg-brand-700 text-white text-xs sm:text-sm font-bold shadow-coral tap-scale transition">
          <i class="fa-solid fa-bag-shopping text-sm"></i>
          <span>Pedir</span>
        </a>
      }
    </div>

  </div>
</header>
