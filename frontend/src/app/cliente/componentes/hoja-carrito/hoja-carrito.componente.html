<!-- Solo hasta lg: en escritorio la comanda es el panel lateral -->
<div class="lg:hidden">
  <app-modal [abierto]="carrito.hojaAbierta()" variante="hoja" claseAncho="sm:max-w-md" clasePanel="max-h-[85dvh]" (cerrado)="cerrar()">
    <div class="shrink-0 px-5 pt-3 pb-3 border-b border-gray-100 dark:border-dark-border">
      <div class="w-10 h-1 rounded-full bg-gray-300 dark:bg-dark-border mx-auto mb-3 sm:hidden"></div>
      <div class="flex items-center justify-between">
        <div class="flex items-center gap-2.5">
          <span class="w-8 h-8 rounded-xl bg-brand-50 dark:bg-brand-900/30 text-brand-600 flex items-center justify-center text-sm"><i class="fa-solid fa-receipt"></i></span>
          <div>
            <h3 class="font-bold text-gray-900 dark:text-white text-sm leading-tight">Tu pedido</h3>
            <p class="text-[11px] text-gray-400 dark:text-dark-muted">{{ carrito.totales().cantidadTotal }} productos</p>
          </div>
        </div>
        <div class="flex items-center gap-3">
          @if (!carrito.estaVacio()) {
            <button type="button" (click)="vaciar()" class="text-[11px] font-bold text-gray-400 hover:text-brand-600">Vaciar</button>
          }
          <button type="button" (click)="cerrar()" class="w-8 h-8 rounded-full bg-gray-100 dark:bg-dark-card text-gray-500 dark:text-dark-muted flex items-center justify-center tap-scale" aria-label="Cerrar">
            <i class="fa-solid fa-xmark text-sm"></i>
          </button>
        </div>
      </div>
    </div>

    @if (carrito.estaVacio()) {
      <div class="px-5 py-10 text-center">
        <p class="font-bold text-sm text-gray-700 dark:text-dark-text">Tu pedido está vacío</p>
        <p class="text-xs text-gray-400 dark:text-dark-muted mt-1">Tocá un producto para sumarlo.</p>
      </div>
    } @else {
      <div class="flex-1 overflow-y-auto custom-scroll px-5">
        <app-lista-items-carrito densidad="compacto" />
      </div>
      <div class="shrink-0 px-5 pt-3 pb-4 border-t border-gray-100 dark:border-dark-border space-y-3 bg-white dark:bg-dark-surface">
        <app-resumen-totales />
        <button type="button" (click)="confirmar()" class="w-full h-12 rounded-2xl bg-brand-600 hover:bg-brand-700 text-white font-bold text-sm shadow-coral tap-scale transition flex items-center justify-center gap-2">
          <i class="fa-brands fa-whatsapp text-base"></i>
          Confirmar pedido
        </button>
      </div>
    }
  </app-modal>
</div>
