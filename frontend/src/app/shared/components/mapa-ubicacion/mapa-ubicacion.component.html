<div class="relative overflow-hidden bg-zinc-100 dark:bg-zinc-800 border border-zinc-200/80 dark:border-zinc-700" [class]="clase()">
  @if (urlSegura(); as url) {
    <iframe [src]="url" class="absolute inset-0 w-full h-full border-0" loading="lazy" referrerpolicy="no-referrer-when-downgrade" allowfullscreen title="Ubicación del local"></iframe>
  } @else {
    <div class="absolute inset-0 flex flex-col items-center justify-center text-center p-4 text-zinc-400">
      <i class="fa-solid fa-map-location-dot text-2xl mb-2"></i>
      <p class="text-xs font-semibold">Pegá el enlace de Google Maps o completá la dirección para ver el mapa</p>
    </div>
  }
</div>
